[package]
name = "tree-sitter-gcode"
description = "Gcode grammar for tree-sitter"
version = "0.1.0"
authors = ["Michael-F-Bryan <consulting@michaelfbryan.com>"]
license = "MIT AND Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "gcode"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/michael-f-bryan/tree-sitter-gcode"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.3"
